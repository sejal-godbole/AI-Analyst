version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ai_analyst_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: analyst_user
      POSTGRES_PASSWORD: analyst_pass
      POSTGRES_DB: ai_analyst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sample_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst_user -d ai_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ai_analyst_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://analyst_user:analyst_pass@postgres:5432/ai_analyst
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
